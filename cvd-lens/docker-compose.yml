services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvdlens
      POSTGRES_USER: cvdlens
      POSTGRES_PASSWORD: cvdlens
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvdlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  inference:
    build: ./inference
    ports:
      - "8000:8000"
    volumes:
      - ../model-training/outputs/onnx:/app/model:ro
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://cvdlens:cvdlens@db:5432/cvdlens
      NEXTAUTH_SECRET: cvdlens-secret-key-2026
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
